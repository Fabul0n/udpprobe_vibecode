name: Rust
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tested toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - run: cargo +1.97.1 fmt --check
      - run: cargo +1.97.1 clippy --locked --all-targets -- -D warnings
      - run: cargo +1.97.1 test --locked
      - run: cargo +1.97.1 build --release --locked
